name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/**"

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Playwright smoke test — frontend only, no backend/OpenAI needed.
  # Skipped by default; enable it by setting the repository/org variable
  # E2E_RUN (or secret E2E_RUN) to `true`.
  e2e:
    name: E2E smoke (frontend, opt-in)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_RUN == 'true' || secrets.E2E_RUN == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e